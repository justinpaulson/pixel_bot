name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Check Ruby style
        run: bin/rubocop -f github
      - name: Scan Rails security
        run: bin/brakeman --no-pager
      - name: Audit JavaScript dependencies
        run: bin/importmap audit
      - name: Test game rules, privacy, generation, and requests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test
      - name: Verify production assets without credentials
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
        run: bin/rails assets:precompile

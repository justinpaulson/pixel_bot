default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Timers and cache hits must remain responsive during slow provider requests.
    - queues: default
      threads: 1
      processes: 1
      polling_interval: 0.1
    - queues: drawings
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
